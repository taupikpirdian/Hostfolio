server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Docker DNS must be queried again when the app container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Allow large file uploads (default is 1MB)
    client_max_body_size 50M;

    # Laravel proxy routes for /images
    location ^~ /images/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # The browser must revalidate the service worker on every visit so a new
    # release can replace cached assets immediately.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Serve versioned static assets directly. Application-owned CSS and JS use
    # a content version in their URL, so immutable caching is safe.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Deny access to .htaccess files
    location ~ /\.ht {
        deny all;
    }

    # Handle Filament assets
    location ~ ^/filament/assets {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
